; Supervisor worker untuk antrean O-KIM (email notifikasi).
; Simpan sebagai /etc/supervisor/conf.d/okim-worker.conf lalu jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
;
; --max-time=300 memutar proses worker setiap 5 menit agar memori/state tidak
; menumpuk dan konfigurasi terbaru ikut termuat. Mailer Resend memakai API HTTP
; sehingga tidak terkena idle-timeout SMTP (451 4.4.2) yang dulu ditangani
; dengan restart berkala ini; opsi tetap dipertahankan untuk kompatibilitas.

[program:okim-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/okim/artisan queue:work --sleep=3 --tries=3 --backoff=60 --max-time=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/okim/storage/logs/worker.log
stopwaitsecs=300
