; Supervisor worker untuk antrean O-KIM (email notifikasi).
; Simpan sebagai /etc/supervisor/conf.d/okim-worker.conf lalu jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status

[program:okim-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/okim/artisan queue:work --sleep=3 --tries=3 --backoff=60 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/okim/storage/logs/worker.log
stopwaitsecs=3600
