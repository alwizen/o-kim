; Supervisor worker untuk antrean O-KIM (email notifikasi).
; Simpan sebagai /etc/supervisor/conf.d/okim-worker.conf lalu jalankan:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status
;
; --max-time=300 memutar proses worker setiap 5 menit sehingga koneksi SMTP
; selalu baru. Relay SES memutus koneksi idle ~60 detik, sementara proteksi
; ping Symfony baru berjalan setelah 100 detik — tanpa restart berkala,
; email berikutnya bisa gagal dengan "451 4.4.2 Timeout waiting for data from client".

[program:okim-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/okim/artisan queue:work --sleep=3 --tries=3 --backoff=60 --max-time=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/okim/storage/logs/worker.log
stopwaitsecs=300
